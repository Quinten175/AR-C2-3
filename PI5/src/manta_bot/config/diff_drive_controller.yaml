controller_manager:
  ros__parameters:
    update_rate: 50

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["motor_left_1_wheel_left_to_motor_left"]
    right_wheel_names: ["motor_right_1_wheel_right_to_motor_right"]

    wheel_separation: 0.265
    wheel_radius: 0.040

    cmd_vel_timeout: 0.5
    use_stamped_vel: true

    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    enable_odom_tf: true
