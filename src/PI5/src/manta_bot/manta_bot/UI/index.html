<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Robot Control Panel</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='styles.css') }}"
    >
</head>

<body>

<div class="dashboard">

    <!-- =========================
         CAMERA
    ========================== -->
    <div class="camera-panel">

        <div class="camera-placeholder">

            <div class="camera-icon">
                ◉
            </div>

            <div class="camera-title">
                CAMERA
            </div>

            <div class="camera-status">
                ● LIVE
            </div>

        </div>

    </div>


    <!-- =========================
         STATS / INFO
    ========================== -->
    <div class="info-panel">

        <h3>Robot Information</h3>

        <div class="info-list">

            <div class="info-item">
                <span>Connection</span>
                <strong class="connected">Connected</strong>
            </div>

            <div class="info-item">
                <span>Battery</span>
                <strong>87%</strong>
            </div>

            <div class="info-item">
                <span>Speed</span>
                <strong>1.2 m/s</strong>
            </div>

            <div class="info-item">
                <span>Temperature</span>
                <strong>36°C</strong>
            </div>

            <div class="info-item">
                <span>Mapping</span>
                <strong id="mappingStatus">Inactive</strong>
            </div>

        </div>

    </div>


    <!-- =========================
         CONTROL BUTTONS
    ========================== -->
    <div class="controls-panel">

        <h3>Control Buttons</h3>

        <div class="control-grid">

            <button class="control-btn">
                Start
            </button>

            <button class="control-btn">
                Stop
            </button>

            <button class="control-btn">
                Reset
            </button>

            <button
                id="toggleBtn"
                class="control-btn mapping-btn"
                onclick="toggleMapping()"
            >
                Toggle Mapping
            </button>

        </div>

    </div>


    <!-- =========================
         DRIVE CONTROL
    ========================== -->
    <div class="drive-panel">

        <h3>Drive Control</h3>

        <div class="drive-controls">

            <button class="drive-btn">
                Forward
            </button>

            <div class="drive-middle">

                <button class="drive-btn">
                    Left
                </button>

                <button class="drive-btn stop-btn">
                    Stop
                </button>

                <button class="drive-btn">
                    Right
                </button>

            </div>

            <button class="drive-btn">
                Reverse
            </button>

        </div>

    </div>

</div>


<script>

function toggleMapping() {

    fetch('/api/toggle', {
        method: 'POST'
    })

    .then(response => response.json())

    .then(data => {

        const button =
            document.getElementById('toggleBtn');

        const status =
            document.getElementById('mappingStatus');

        if (data.state) {

            button.classList.add('active');
            button.innerText = 'Mapping Active';

            status.innerText = 'Active';
            status.classList.add('active-status');

        } else {

            button.classList.remove('active');
            button.innerText = 'Toggle Mapping';

            status.innerText = 'Inactive';
            status.classList.remove('active-status');

        }

    })

    .catch(error => {
        console.error('Mapping error:', error);
    });

}

</script>

</body>
</html>
