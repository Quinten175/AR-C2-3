<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="'Segoe UI', Arial, sans-serif">

  <!-- Background -->
  <rect width="960" height="720" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">AR-C2-3 — Layered Embedded Architecture</text>

  <!-- ==================== LAYER BORDERS ==================== -->

  <!-- Application Layer -->
  <rect x="40" y="50" width="880" height="120" rx="6" fill="#eaf2f8" stroke="#3498db" stroke-width="2"/>
  <text x="50" y="72" font-size="13" font-weight="bold" fill="#2c3e50">Application Layer (ROS2 nodes on Raspberry Pi)</text>

  <!-- Middleware Layer -->
  <rect x="40" y="180" width="880" height="90" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
  <text x="50" y="202" font-size="13" font-weight="bold" fill="#2c3e50">Middleware Layer (ROS2 / DDS)</text>

  <!-- Driver/Translation Layer -->
  <rect x="40" y="280" width="880" height="110" rx="6" fill="#f4ecf7" stroke="#9b59b6" stroke-width="2"/>
  <text x="50" y="302" font-size="13" font-weight="bold" fill="#2c3e50">Driver / Translation Layer (ROS2 + Python)</text>

  <!-- Communication Layer -->
  <rect x="40" y="400" width="880" height="70" rx="6" fill="#e8f8f5" stroke="#1abc9c" stroke-width="2"/>
  <text x="50" y="422" font-size="13" font-weight="bold" fill="#2c3e50">Communication Layer (UART Serial)</text>

  <!-- Hardware Abstraction Layer -->
  <rect x="40" y="480" width="880" height="110" rx="6" fill="#fdedec" stroke="#e74c3c" stroke-width="2"/>
  <text x="50" y="502" font-size="13" font-weight="bold" fill="#2c3e50">Hardware Abstraction Layer (Arduino / C++)</text>

  <!-- Physical Layer -->
  <rect x="40" y="600" width="880" height="90" rx="6" fill="#eaecee" stroke="#7f8c8d" stroke-width="2"/>
  <text x="50" y="622" font-size="13" font-weight="bold" fill="#2c3e50">Physical Layer</text>

  <!-- ==================== MODULES: APPLICATION LAYER ==================== -->

  <!-- Gamepad CmdVel -->
  <rect x="70" y="84" width="160" height="70" rx="4" fill="#ffffff" stroke="#3498db" stroke-width="1.5"/>
  <text x="150" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">Gamepad CmdVel</text>
  <text x="150" y="130" text-anchor="middle" font-size="9" fill="#7f8c8d">movement_handler.py</text>

  <!-- SLAM/Mapping -->
  <rect x="260" y="84" width="160" height="70" rx="4" fill="#ffffff" stroke="#3498db" stroke-width="1.5"/>
  <text x="340" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">SLAM / Mapping</text>
  <text x="340" y="130" text-anchor="middle" font-size="9" fill="#7f8c8d">activate_mapping.py</text>

  <!-- Camera Stream -->
  <rect x="450" y="84" width="160" height="70" rx="4" fill="#ffffff" stroke="#3498db" stroke-width="1.5"/>
  <text x="530" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">Camera Stream</text>
  <text x="530" y="130" text-anchor="middle" font-size="9" fill="#7f8c8d">stream_node.py, yolo26_ros.py</text>

  <!-- UI App -->
  <rect x="640" y="84" width="160" height="70" rx="4" fill="#ffffff" stroke="#3498db" stroke-width="1.5"/>
  <text x="720" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">Web UI</text>
  <text x="720" y="130" text-anchor="middle" font-size="9" fill="#7f8c8d">UI_app.py (Flask)</text>

  <!-- ==================== MODULES: MIDDLEWARE LAYER ==================== -->

  <rect x="140" y="210" width="680" height="50" rx="4" fill="#ffffff" stroke="#f39c12" stroke-width="1.5"/>
  <text x="480" y="235" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50">ROS2 Topic Bus</text>
  <text x="480" y="252" text-anchor="middle" font-size="9" fill="#7f8c8d">/cmd_vel · /odom · /scan · /camera/image_raw · /tf · /tf_static</text>

  <!-- ==================== MODULES: DRIVER LAYER ==================== -->

  <!-- CmdVelPublisher -->
  <rect x="70" y="314" width="200" height="65" rx="4" fill="#ffffff" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="170" y="342" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">CmdVel Publisher</text>
  <text x="170" y="360" text-anchor="middle" font-size="9" fill="#7f8c8d">serial_com.py</text>
  <text x="170" y="374" text-anchor="middle" font-size="8" fill="#95a5a6">TwistStamped → Serial</text>

  <!-- Static Odom -->
  <rect x="320" y="314" width="200" height="65" rx="4" fill="#ffffff" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="420" y="342" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">Static Odom Publisher</text>
  <text x="420" y="360" text-anchor="middle" font-size="9" fill="#7f8c8d">static_odom_publisher.py</text>
  <text x="420" y="374" text-anchor="middle" font-size="8" fill="#95a5a6">Serial → Odometry</text>

  <!-- FakeLidarNode -->
  <rect x="570" y="314" width="200" height="65" rx="4" fill="#ffffff" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="670" y="342" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">FakeLidarNode</text>
  <text x="670" y="360" text-anchor="middle" font-size="9" fill="#7f8c8d">fakelidarnode.py</text>
  <text x="670" y="374" text-anchor="middle" font-size="8" fill="#95a5a6">Serial → LaserScan</text>

  <!-- ==================== MODULES: COMMUNICATION LAYER ==================== -->

  <rect x="200" y="425" width="560" height="35" rx="4" fill="#ffffff" stroke="#1abc9c" stroke-width="1.5"/>
  <text x="480" y="447" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50">UART Serial — /dev/ttyACM0 · 115200 baud · ASCII Protocol</text>

  <!-- ==================== MODULES: HARDWARE ABSTRACTION LAYER ==================== -->

  <!-- Motor Control -->
  <rect x="70" y="514" width="180" height="65" rx="4" fill="#ffffff" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="160" y="542" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">Motor Control</text>
  <text x="160" y="560" text-anchor="middle" font-size="9" fill="#7f8c8d">motor_control.h/cpp</text>
  <text x="160" y="574" text-anchor="middle" font-size="8" fill="#95a5a6">PWM + Direction GPIO</text>

  <!-- Encoder -->
  <rect x="300" y="514" width="180" height="65" rx="4" fill="#ffffff" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="390" y="542" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">Encoder Reader</text>
  <text x="390" y="560" text-anchor="middle" font-size="9" fill="#7f8c8d">encoder.h/cpp</text>
  <text x="390" y="574" text-anchor="middle" font-size="8" fill="#95a5a6">Hall interrupts (pins 18,19)</text>

  <!-- PID Controller -->
  <rect x="530" y="514" width="180" height="65" rx="4" fill="#ffffff" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="620" y="542" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">PID Controller</text>
  <text x="620" y="560" text-anchor="middle" font-size="9" fill="#7f8c8d">pid.h/cpp</text>
  <text x="620" y="574" text-anchor="middle" font-size="8" fill="#95a5a6">PI speed control (Kp, Ki)</text>

  <!-- Closed Loop -->
  <rect x="760" y="514" width="130" height="65" rx="4" fill="#ffffff" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="825" y="542" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">Closed Loop</text>
  <text x="825" y="560" text-anchor="middle" font-size="9" fill="#7f8c8d">closed_loop.h/cpp</text>
  <text x="825" y="574" text-anchor="middle" font-size="8" fill="#95a5a6">Orchestrator (50 Hz)</text>

  <!-- ==================== MODULES: PHYSICAL LAYER ==================== -->

  <!-- L298N Driver -->
  <rect x="70" y="634" width="140" height="45" rx="4" fill="#ffffff" stroke="#7f8c8d" stroke-width="1.5"/>
  <text x="140" y="655" text-anchor="middle" font-size="10" font-weight="bold" fill="#2c3e50">L298N Driver (x2)</text>
  <text x="140" y="670" text-anchor="middle" font-size="8" fill="#7f8c8d">H-bridge PWM</text>

  <!-- Hall Encoders -->
  <rect x="250" y="634" width="140" height="45" rx="4" fill="#ffffff" stroke="#7f8c8d" stroke-width="1.5"/>
  <text x="320" y="655" text-anchor="middle" font-size="10" font-weight="bold" fill="#2c3e50">Hall Encoders (x2)</text>
  <text x="320" y="670" text-anchor="middle" font-size="8" fill="#7f8c8d">11 PPR, 34:1 gear</text>

  <!-- JGB37 Motors -->
  <rect x="430" y="634" width="140" height="45" rx="4" fill="#ffffff" stroke="#7f8c8d" stroke-width="1.5"/>
  <text x="500" y="655" text-anchor="middle" font-size="10" font-weight="bold" fill="#2c3e50">JGB37-520 Motors (x2)</text>
  <text x="500" y="670" text-anchor="middle" font-size="8" fill="#7f8c8d">DC geared motors</text>

  <!-- RPLiDAR -->
  <rect x="610" y="634" width="140" height="45" rx="4" fill="#ffffff" stroke="#7f8c8d" stroke-width="1.5"/>
  <text x="680" y="655" text-anchor="middle" font-size="10" font-weight="bold" fill="#2c3e50">RPLiDAR</text>
  <text x="680" y="670" text-anchor="middle" font-size="8" fill="#7f8c8d">2D LiDAR (UART)</text>

  <!-- USB Camera -->
  <rect x="790" y="634" width="120" height="45" rx="4" fill="#ffffff" stroke="#7f8c8d" stroke-width="1.5"/>
  <text x="850" y="655" text-anchor="middle" font-size="10" font-weight="bold" fill="#2c3e50">USB Camera</text>
  <text x="850" y="670" text-anchor="middle" font-size="8" fill="#7f8c8d">Video capture</text>

  <!-- ==================== ARROWS: DOWNWARD FLOW (commands) ==================== -->

  <!-- Application → Middleware -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
  </defs>

  <!-- Gamepad → /cmd_vel -->
  <line x1="150" y1="154" x2="150" y2="208" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- SLAM → /scan -->
  <line x1="340" y1="154" x2="340" y2="208" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Camera → /image -->
  <line x1="530" y1="154" x2="530" y2="208" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Middleware → Driver -->
  <line x1="170" y1="270" x2="170" y2="312" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="180" y="294" font-size="8" fill="#7f8c8d">/cmd_vel</text>

  <line x1="420" y1="270" x2="420" y2="312" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="430" y="294" font-size="8" fill="#7f8c8d">/odom</text>

  <line x1="670" y1="270" x2="670" y2="312" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="680" y="294" font-size="8" fill="#7f8c8d">/scan</text>

  <!-- Driver → Communication -->
  <line x1="170" y1="379" x2="170" y2="423" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="180" y="404" font-size="8" fill="#7f8c8d">V:rpm</text>

  <line x1="420" y1="379" x2="420" y2="423" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="430" y="404" font-size="8" fill="#7f8c8d">ticks</text>

  <!-- Communication → HWA -->
  <line x1="480" y1="470" x2="480" y2="512" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ==================== ARROWS: UPWARD FLOW (data) ==================== -->

  <!-- Physical → HWA -->
  <line x1="140" y1="632" x2="140" y2="579" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <line x1="320" y1="632" x2="320" y2="579" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <line x1="500" y1="632" x2="500" y2="579" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- HWA → Communication (encoder data up) -->
  <line x1="390" y1="512" x2="390" y2="470" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Communication → Driver (status up) -->
  <line x1="480" y1="470" x2="480" y2="396" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Driver → Middleware (odom up) -->
  <line x1="420" y1="312" x2="420" y2="270" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ==================== LEGEND ==================== -->
  <rect x="680" y="690" width="260" height="22" rx="3" fill="#f8f9fa" stroke="#bdc3c7" stroke-width="1"/>
  <line x1="695" y1="701" x2="720" y2="701" stroke="#2c3e50" stroke-width="2"/>
  <text x="725" y="705" font-size="9" fill="#2c3e50">Command flow (top → bottom)</text>
  <line x1="840" y1="701" x2="865" y2="701" stroke="#e74c3c" stroke-width="2"/>
  <text x="870" y="705" font-size="9" fill="#2c3e50">Data flow (bottom → top)</text>

</svg>
