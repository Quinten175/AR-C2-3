<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'Segoe UI', Arial, sans-serif">

  <!-- Background -->
  <rect width="960" height="540" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">Information Flow — Manta Bot</text>

  <!-- ==================== ARROWS (defs) ==================== -->
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e67e22"/>
    </marker>
  </defs>

  <!-- ==================== CONTROL PATH (top half) ==================== -->

  <!-- Gamepad node -->
  <rect x="40" y="60" width="130" height="50" rx="8" fill="#d6eaf8" stroke="#2980b9" stroke-width="2"/>
  <text x="105" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">Gamepad</text>
  <text x="105" y="97" text-anchor="middle" font-size="9" fill="#7f8c8d">/dev/input/js0</text>

  <!-- /cmd_vel topic -->
  <rect x="230" y="60" width="140" height="50" rx="8" fill="#fef9e7" stroke="#b7950b" stroke-width="2"/>
  <text x="300" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">/cmd_vel</text>
  <text x="300" y="97" text-anchor="middle" font-size="9" fill="#7f8c8d">TwistStamped</text>

  <!-- cmd_vel_publisher -->
  <rect x="420" y="60" width="150" height="50" rx="8" fill="#eaf2f8" stroke="#3498db" stroke-width="2"/>
  <text x="495" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">CmdVel Publisher</text>
  <text x="495" y="97" text-anchor="middle" font-size="9" fill="#7f8c8d">serial_com.py</text>

  <!-- Serial link -->
  <rect x="620" y="60" width="130" height="50" rx="8" fill="#e8f8f5" stroke="#1abc9c" stroke-width="2"/>
  <text x="685" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">Serial UART</text>
  <text x="685" y="97" text-anchor="middle" font-size="9" fill="#7f8c8d">/dev/ttyACM0 · V:rpm</text>

  <!-- Arduino Mega -->
  <rect x="810" y="60" width="120" height="50" rx="8" fill="#fdedec" stroke="#e74c3c" stroke-width="2"/>
  <text x="870" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">Arduino Mega</text>
  <text x="870" y="97" text-anchor="middle" font-size="9" fill="#7f8c8d">ATmega2560</text>

  <!-- Arrows: control path -->
  <line x1="170" y1="85" x2="230" y2="85" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="200" y="78" font-size="9" fill="#7f8c8d">TwistStamped</text>

  <line x1="370" y1="85" x2="420" y2="85" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="395" y="78" font-size="9" fill="#7f8c8d">subscribe</text>

  <line x1="570" y1="85" x2="620" y2="85" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="595" y="78" font-size="9" fill="#7f8c8d">parse + send</text>

  <line x1="750" y1="85" x2="810" y2="85" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="780" y="78" font-size="9" fill="#7f8c8d">V:rpm1,rpm2</text>

  <!-- ==================== MEGA INTERNAL LOOP (middle) ==================== -->

  <!-- closed_loop_update -->
  <rect x="810" y="160" width="120" height="50" rx="8" fill="#fdedec" stroke="#e74c3c" stroke-width="2"/>
  <text x="870" y="182" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">closed_loop</text>
  <text x="870" y="197" text-anchor="middle" font-size="9" fill="#7f8c8d">50 Hz PID loop</text>

  <!-- Arrow: Mega → closed_loop -->
  <line x1="870" y1="110" x2="870" y2="160" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <!-- encoder_delta (left side of loop) -->
  <rect x="590" y="160" width="140" height="50" rx="8" fill="#fdebd0" stroke="#e67e22" stroke-width="2"/>
  <text x="660" y="182" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">encoder_delta()</text>
  <text x="660" y="197" text-anchor="middle" font-size="9" fill="#7f8c8d">ticks → RPM</text>

  <!-- PID update -->
  <rect x="390" y="160" width="140" height="50" rx="8" fill="#fdebd0" stroke="#e67e22" stroke-width="2"/>
  <text x="460" y="182" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">PID update</text>
  <text x="460" y="197" text-anchor="middle" font-size="9" fill="#7f8c8d">Kp=0.71, Ki=7.5</text>

  <!-- motor_control -->
  <rect x="190" y="160" width="140" height="50" rx="8" fill="#fdebd0" stroke="#e67e22" stroke-width="2"/>
  <text x="260" y="182" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">motor_control</text>
  <text x="260" y="197" text-anchor="middle" font-size="9" fill="#7f8c8d">PWM + direction</text>

  <!-- Arrows: internal loop (right to left) -->
  <line x1="810" y1="185" x2="730" y2="185" stroke="#e67e22" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <line x1="590" y1="185" x2="530" y2="185" stroke="#e67e22" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <line x1="390" y1="185" x2="330" y2="185" stroke="#e67e22" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <!-- Arrow: motor_control → L298N (down) -->
  <line x1="260" y1="210" x2="260" y2="250" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <!-- L298N / Motors (bottom of control path) -->
  <rect x="190" y="254" width="140" height="50" rx="8" fill="#fadbd8" stroke="#c0392b" stroke-width="2"/>
  <text x="260" y="276" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">L298N → Motors</text>
  <text x="260" y="291" text-anchor="middle" font-size="9" fill="#7f8c8d">JGB37-520 (x2)</text>

  <!-- Arrow: motors → encoders (feedback loop, bottom to top-left) -->
  <path d="M 260 304 L 260 410 L 660 410" stroke="#e67e22" stroke-width="2" fill="none" marker-end="url(#arrow-orange)" stroke-dasharray="5,3"/>

  <!-- ==================== SENSOR PATHS (bottom half) ==================== -->

  <!-- RPLiDAR path -->
  <rect x="40" y="370" width="120" height="50" rx="8" fill="#fadbd8" stroke="#c0392b" stroke-width="2"/>
  <text x="100" y="392" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">RPLiDAR</text>
  <text x="100" y="407" text-anchor="middle" font-size="9" fill="#7f8c8d">UART sensor</text>

  <!-- /scan topic -->
  <rect x="230" y="370" width="140" height="50" rx="8" fill="#fef9e7" stroke="#b7950b" stroke-width="2"/>
  <text x="300" y="392" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">/scan</text>
  <text x="300" y="407" text-anchor="middle" font-size="9" fill="#7f8c8d">LaserScan</text>

  <!-- SLAM node -->
  <rect x="420" y="370" width="150" height="50" rx="8" fill="#eaf2f8" stroke="#3498db" stroke-width="2"/>
  <text x="495" y="392" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">SLAM / Mapping</text>
  <text x="495" y="407" text-anchor="middle" font-size="9" fill="#7f8c8d">GMapping / Cartographer</text>

  <!-- map output -->
  <rect x="630" y="370" width="120" height="50" rx="8" fill="#d5f5e3" stroke="#27ae60" stroke-width="2"/>
  <text x="690" y="392" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">map + pose</text>
  <text x="690" y="407" text-anchor="middle" font-size="9" fill="#7f8c8d">/map, /tf</text>

  <!-- Arrows: RPLiDAR path -->
  <line x1="160" y1="395" x2="230" y2="395" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="195" y="388" font-size="9" fill="#7f8c8d">LaserScan</text>

  <line x1="370" y1="395" x2="420" y2="395" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="395" y="388" font-size="9" fill="#7f8c8d">subscribe</text>

  <line x1="570" y1="395" x2="630" y2="395" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="600" y="388" font-size="9" fill="#7f8c8d">publish</text>

  <!-- USB Camera path -->
  <rect x="40" y="450" width="120" height="50" rx="8" fill="#fadbd8" stroke="#c0392b" stroke-width="2"/>
  <text x="100" y="472" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">USB Camera</text>
  <text x="100" y="487" text-anchor="middle" font-size="9" fill="#7f8c8d">/dev/video0</text>

  <!-- /image_raw topic -->
  <rect x="230" y="450" width="160" height="50" rx="8" fill="#fef9e7" stroke="#b7950b" stroke-width="2"/>
  <text x="310" y="472" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">/camera/image_raw</text>
  <text x="310" y="487" text-anchor="middle" font-size="9" fill="#7f8c8d">sensor_msgs/Image</text>

  <!-- YOLO detection -->
  <rect x="440" y="450" width="160" height="50" rx="8" fill="#eaf2f8" stroke="#3498db" stroke-width="2"/>
  <text x="520" y="472" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">YOLO Detection</text>
  <text x="520" y="487" text-anchor="middle" font-size="9" fill="#7f8c8d">yolo26_ros.py</text>

  <!-- Arrows: Camera path -->
  <line x1="160" y1="475" x2="230" y2="475" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="195" y="468" font-size="9" fill="#7f8c8d">Image</text>

  <line x1="390" y1="475" x2="440" y2="475" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="415" y="468" font-size="9" fill="#7f8c8d">subscribe</text>

  <!-- Encoder data path -->
  <rect x="680" y="370" width="120" height="50" rx="8" fill="#fdebd0" stroke="#e67e22" stroke-width="2"/>
  <text x="740" y="392" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">Encoder ticks</text>
  <text x="740" y="407" text-anchor="middle" font-size="9" fill="#7f8c8d">via Serial</text>

  <!-- static_odom_publisher -->
  <rect x="680" y="450" width="160" height="50" rx="8" fill="#eaf2f8" stroke="#3498db" stroke-width="2"/>
  <text x="760" y="472" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">Static Odom Publisher</text>
  <text x="760" y="487" text-anchor="middle" font-size="9" fill="#7f8c8d">static_odom_publisher.py</text>

  <!-- /odom + TF output -->
  <rect x="890" y="450" width="60" height="50" rx="8" fill="#fef9e7" stroke="#b7950b" stroke-width="2"/>
  <text x="920" y="472" text-anchor="middle" font-size="10" font-weight="bold" fill="#2c3e50">/odom</text>
  <text x="920" y="487" text-anchor="middle" font-size="8" fill="#7f8c8d">+ TF</text>

  <!-- Arrows: Encoder path -->
  <line x1="740" y1="420" x2="740" y2="450" stroke="#e67e22" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="750" y="440" font-size="9" fill="#7f8c8d">ticks</text>

  <line x1="840" y1="475" x2="890" y2="475" stroke="#e67e22" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="865" y="468" font-size="9" fill="#7f8c8d">publish</text>

  <!-- ==================== FEEDBACK LABELS ==================== -->
  <rect x="300" y="415" width="280" height="28" rx="6" fill="#ffffff" stroke="#e67e22" stroke-width="1"/>
  <text x="440" y="434" text-anchor="middle" font-size="10" fill="#e67e22">← Encoder feedback loop (ticks → RPM → PID)</text>

  <!-- ==================== LEGEND ==================== -->
  <rect x="40" y="518" width="880" height="18" rx="4" fill="#f8f9fa"/>
  <line x1="60" y1="527" x2="90" y2="527" stroke="#2c3e50" stroke-width="2"/>
  <text x="95" y="531" font-size="10" fill="#2c3e50">Command flow</text>
  <line x1="200" y1="527" x2="230" y2="527" stroke="#e67e22" stroke-width="2"/>
  <text x="235" y="531" font-size="10" fill="#2c3e50">Sensor/feedback flow</text>
  <line x1="380" y1="527" x2="410" y2="527" stroke="#e67e22" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="415" y="531" font-size="10" fill="#2c3e50">Encoder feedback (dashed)</text>

</svg>
