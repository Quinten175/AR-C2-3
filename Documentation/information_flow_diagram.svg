<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2240 1630" font-family="Arial, sans-serif" font-size="16" fill="#18324b" role="img" aria-labelledby="title desc">
  <title id="title">Manta Bot information flow and unused measured wheel feedback</title>
  <desc id="desc">Two stamped velocity publishers feed diff_drive_controller, then the C++ plugin and Mega local PI loop. PWM drives two H-bridge channels and motors; encoder measurements feed only the local loop. Signed RPM1 and RPM2 telemetry is emitted at 5 Hz but unused by the plugin. Its read method mirrors commands and integrates positions, producing command-derived odometry and joint states. A direct LiDAR path feeds async SLAM. The camera source-only path is disabled in setup.py. Drive and SLAM launches are separate.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#315977"/></marker>
    <marker id="unused-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a04c16"/></marker>
    <style>.card{fill:#fff;stroke:#8298ab;stroke-width:2}.edge{fill:none;stroke:#315977;stroke-width:2.5;marker-end:url(#arrow)}.disabled{stroke:#7356a0;stroke-dasharray:9 6}.unused{fill:none;stroke:#a04c16;stroke-width:2.5;stroke-dasharray:3 6;marker-end:url(#unused-arrow)}.heading{font-size:21px;font-weight:bold}.warning{fill:#934413}</style>
  </defs>
  <rect width="2240" height="1630" fill="#f5f8fb"/>
  <text x="50" y="52" font-size="30" font-weight="bold">Manta Bot | Information flow</text>
  <text x="50" y="85">Configured connections are not runtime verification. Measured feedback closes only the Mega loop, not ROS odometry.</text>
  <rect x="40" y="115" width="2160" height="740" rx="16" fill="#eaf2f9" stroke="#bbcbd9"/>
  <text x="65" y="153" class="heading">1 | Drive command path and feedback boundary</text>
  <rect x="65" y="205" width="340" height="120" rx="10" class="card"/>
  <text x="85" y="236" font-weight="bold">GamepadCmdVel</text>
  <text x="85" y="264">Movement/controller.py</text>
  <text x="85" y="291">/dev/input/js0; gamepad_controller</text>
  <text x="85" y="313">Manual start, not auto-launched</text>
  <rect x="65" y="365" width="340" height="120" rx="10" class="card"/>
  <text x="85" y="396" font-weight="bold">Browser to Flask UI_app.py</text>
  <text x="85" y="424">HTTP 5000 drive requests</text>
  <text x="85" y="452">No sensor subscriptions</text>
  <text x="85" y="474">Dashboard sensor placeholders</text>
  <path d="M405 265 H445 V325 H490" class="edge"/>
  <path d="M405 425 H445 V355 H490" class="edge"/>
  <rect x="490" y="300" width="210" height="85" rx="10" class="card"/>
  <text x="510" y="333" font-weight="bold">/cmd_vel</text>
  <text x="510" y="362">TwistStamped</text>
  <path d="M700 342 H810" class="edge"/>
  <text x="724" y="321">Remapped</text>
  <rect x="810" y="260" width="365" height="170" rx="10" class="card"/>
  <text x="830" y="291" class="heading">diff_drive_controller</text>
  <text x="830" y="320">ros2_control manager: 50 Hz</text>
  <text x="830" y="349">Radius 0.040 m; separation 0.265 m</text>
  <text x="830" y="378">Stamped-command timeout: 0.5 s</text>
  <text x="830" y="407">Wheel velocity targets in rad/s</text>
  <path d="M1175 342 H1320" class="edge"/>
  <text x="1200" y="321">Wheel targets</text>
  <rect x="1320" y="260" width="430" height="170" rx="10" class="card"/>
  <text x="1340" y="291" font-weight="bold">C++ manta_hardware/MantaHardware</text>
  <text x="1340" y="320">write(): rad/s to RPM</text>
  <text x="1340" y="349">/dev/ttyAMA0, 115200 baud</text>
  <text x="1340" y="378">V:leftRPM,rightRPM + newline</text>
  <text x="1340" y="407">VS on activation / deactivation</text>
  <path d="M1750 342 H1860" class="edge"/>
  <text x="1766" y="321">UART TX</text>
  <rect x="1860" y="260" width="315" height="170" rx="10" class="card"/>
  <text x="1880" y="291" class="heading">Mega main.cpp</text>
  <text x="1880" y="320">Line parser sets wheel targets</text>
  <text x="1880" y="349">Silence &gt;500 ms: stop outputs</text>
  <text x="1880" y="378">VS / ESTOP: not latched</text>
  <text x="1880" y="407">Valid drive command can resume</text>
  <path d="M2015 260 V205 H1540 V260" class="unused"/>
  <text x="1340" y="184" class="warning">Signed RPM1/RPM2 at 5 Hz: emitted but unused by plugin</text>

  <rect x="65" y="555" width="530" height="130" rx="10" class="card"/>
  <text x="85" y="586" class="heading">Command-derived ROS outputs</text>
  <text x="85" y="615">/diff_drive_controller/odom; odom to base_footprint TF</text>
  <text x="85" y="644">joint_state_broadcaster: /joint_states</text>
  <text x="85" y="672">robot_state_publisher: wheel joint transforms</text>
  <rect x="750" y="555" width="650" height="130" rx="10" class="card"/>
  <text x="770" y="586" class="heading">Plugin read() | assumed states, not measured feedback</text>
  <text x="770" y="615">state_vel = cmd_vel; state_pos += state_vel × period</text>
  <text x="770" y="644" class="warning">read_status() is unused; firmware SS direct print is disabled.</text>
  <text x="770" y="672" class="warning">No measured encoder RPM feeds ROS wheel states or odometry.</text>
  <path d="M1535 430 V500 H1075 V555" class="edge"/>
  <text x="1110" y="483">Command mirror and integration</text>
  <path d="M750 620 H595" class="edge"/>
  <text x="612" y="599">ROS consumers</text>
  <rect x="1500" y="555" width="675" height="130" rx="10" class="card"/>
  <text x="1520" y="586" class="heading">closed_loop.cpp + pid.cpp | local PI, nominal 50 Hz</text>
  <text x="1520" y="615">Actual elapsed dt; signed RPM measurements; magnitude comparison</text>
  <text x="1520" y="644">motor_control.cpp: PWM D2/D7; direction D3-D6</text>
  <text x="1520" y="672" class="warning">Cooperative execution, not hard real-time or guaranteed braking</text>
  <path d="M2015 430 V555" class="edge"/>
  <text x="2035" y="496">Wheel targets</text>
  <rect x="1500" y="755" width="675" height="75" rx="10" class="card"/>
  <text x="1520" y="784" font-weight="bold">Two H-bridge channels to two motors and quadrature encoders</text>
  <text x="1520" y="813">A/B D18/19 and D20/21; ISRs D18/D20; 748 counts/rev</text>
  <path d="M1610 685 V755" class="edge"/>
  <text x="1520" y="726">Motor drive</text>
  <path d="M2065 755 V685" class="edge"/>
  <text x="1880" y="726">Local encoder feedback</text>
  <text x="65" y="744">Telemetry is measured on Mega but is not consumed on Pi.</text>
  <text x="65" y="774">Stop actions set PWM = 0 and direction pins LOW; no safety latch or braking guarantee.</text>
  <text x="65" y="804">Driver board count is unspecified. 748 counts/rev = 11 × 2 × 34.</text>

  <rect x="40" y="890" width="2160" height="195" rx="16" fill="#edf6f1" stroke="#bbcbd9"/>
  <text x="65" y="928" class="heading">2 | Real LiDAR directly on Pi, no Mega hop</text>
  <rect x="65" y="955" width="445" height="100" rx="10" class="card"/>
  <text x="85" y="986" font-weight="bold">RPLiDAR to /dev/ttyUSB0</text>
  <text x="85" y="1014">rplidar_ros/rplidar_composition</text>
  <text x="85" y="1041">LaserScan header frame_id: laser_frame</text>
  <path d="M510 1005 H650" class="edge"/>
  <text x="533" y="984">Publishes</text>
  <rect x="650" y="965" width="260" height="80" rx="10" class="card"/>
  <text x="670" y="996" font-weight="bold">/scan</text>
  <text x="670" y="1025">sensor_msgs/LaserScan</text>
  <path d="M910 1005 H1070" class="edge"/>
  <text x="935" y="984">Subscribes</text>
  <rect x="1070" y="955" width="545" height="100" rx="10" class="card"/>
  <text x="1090" y="986" class="heading">Async SLAM Toolbox</text>
  <text x="1090" y="1014">async_slam_toolbox_node</text>
  <text x="1090" y="1041">Requires drive odom and the URDF TF chain</text>
  <path d="M1615 1005 H1800" class="edge"/>
  <text x="1660" y="984">Publishes</text>
  <rect x="1800" y="965" width="375" height="80" rx="10" class="card"/>
  <text x="1820" y="996" font-weight="bold">/map + map to odom TF</text>
  <text x="1820" y="1025">Map output and frame alignment</text>

  <rect x="40" y="1120" width="2160" height="270" rx="16" fill="#f3eff8" stroke="#bbcbd9"/>
  <text x="65" y="1158" class="heading">3 | Camera source-only path: console scripts commented out in setup.py, not launch-enabled</text>
  <rect x="65" y="1220" width="355" height="105" rx="10" class="card disabled"/>
  <text x="85" y="1251" font-weight="bold">camera_publisher.py</text>
  <text x="85" y="1280">OpenCV capture on Pi</text>
  <text x="85" y="1308">Publishes /image_raw (Image)</text>
  <path d="M420 1272 H575" class="edge disabled"/>
  <text x="440" y="1251">/image_raw</text>
  <rect x="575" y="1220" width="325" height="105" rx="10" class="card disabled"/>
  <text x="595" y="1251" font-weight="bold">yolo26_ros2.py</text>
  <text x="595" y="1280">Object detections</text>
  <text x="595" y="1308">JPEG annotated images</text>
  <path d="M740 1220 V1190 H1090" class="edge disabled"/>
  <text x="1110" y="1196">/detections (Detection2DArray); no configured downstream consumer shown</text>
  <path d="M900 1272 H1330" class="edge disabled"/>
  <text x="935" y="1251">/image_annotated/compressed</text>
  <text x="1030" y="1309">CompressedImage</text>
  <rect x="1330" y="1220" width="360" height="105" rx="10" class="card disabled"/>
  <text x="1350" y="1251" font-weight="bold">stream.py</text>
  <text x="1350" y="1280">Compressed image subscriber</text>
  <text x="1350" y="1308">Separate HTTP server on 9091</text>
  <path d="M1690 1272 H1860" class="edge disabled"/>
  <text x="1710" y="1251">HTTP 9091</text>
  <rect x="1860" y="1220" width="315" height="105" rx="10" class="card disabled"/>
  <text x="1880" y="1251" font-weight="bold">Browser</text>
  <text x="1880" y="1280">Camera stream endpoint</text>
  <text x="1880" y="1308">Not Flask sensor feedback</text>
  <text x="65" y="1365">Camera bypasses Mega. Dashed purple wiring describes available source, not an enabled or running camera pipeline.</text>

  <rect x="40" y="1420" width="2160" height="165" rx="12" fill="#fff" stroke="#bbcbd9"/>
  <text x="65" y="1453" class="heading">Launch composition and legend</text>
  <text x="65" y="1482">Compose diff_drive.launch.py (drive and robot_state_publisher) with slam.launch.py (LiDAR, SLAM activation and Flask). No complete robot launch exists.</text>
  <text x="65" y="1511">Start gamepad_controller separately. Camera console scripts remain commented. No assumed sensor or TF publication rates are shown.</text>
  <path d="M65 1550 H140" class="edge"/><text x="160" y="1556">Solid blue: configured flow, including local feedback</text>
  <path d="M865 1550 H940" class="edge disabled"/><text x="960" y="1556">Long dashed purple: disabled camera</text>
  <path d="M1570 1550 H1645" class="unused"/><text x="1665" y="1556">Short dashed amber: unused telemetry</text>
</svg>
