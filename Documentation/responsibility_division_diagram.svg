<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="'Segoe UI', Arial, sans-serif">

  <!-- Background -->
  <rect width="760" height="420" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="380" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">Responsibility Division — Raspberry Pi vs Arduino Mega</text>

  <!-- ==================== RASPBERRY PI COLUMN ==================== -->
  <rect x="40" y="60" width="330" height="310" rx="8" fill="#d6eaf8" stroke="#2980b9" stroke-width="2"/>

  <!-- Pi header -->
  <rect x="40" y="60" width="330" height="50" rx="8" fill="#2980b9"/>
  <text x="205" y="92" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Raspberry Pi</text>

  <!-- Pi items -->
  <g font-size="13" fill="#2c3e50">
    <circle cx="70" cy="140" r="5" fill="#2980b9"/>
    <text x="85" y="145">ROS2 middleware (DDS topic bus)</text>

    <circle cx="70" cy="180" r="5" fill="#2980b9"/>
    <text x="85" y="185">SLAM / mapping (GMapping, Cartographer)</text>

    <circle cx="70" cy="220" r="5" fill="#2980b9"/>
    <text x="85" y="225">YOLO object detection</text>

    <circle cx="70" cy="260" r="5" fill="#2980b9"/>
    <text x="85" y="265">Camera streaming (usb_cam)</text>

    <circle cx="70" cy="300" r="5" fill="#2980b9"/>
    <text x="85" y="305">Web UI dashboard (Flask)</text>

    <circle cx="70" cy="340" r="5" fill="#2980b9"/>
    <text x="85" y="345">Odometry publishing (/odom, /tf)</text>
  </g>

  <!-- ==================== ARDUINO MEGA COLUMN ==================== -->
  <rect x="390" y="60" width="330" height="310" rx="8" fill="#fdedec" stroke="#e74c3c" stroke-width="2"/>

  <!-- Mega header -->
  <rect x="390" y="60" width="330" height="50" rx="8" fill="#e74c3c"/>
  <text x="555" y="92" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Arduino Mega (ATmega2560)</text>

  <!-- Mega items -->
  <g font-size="13" fill="#2c3e50">
    <circle cx="420" cy="140" r="5" fill="#e74c3c"/>
    <text x="435" y="145">Real-time PID loops (50 Hz)</text>

    <circle cx="420" cy="180" r="5" fill="#e74c3c"/>
    <text x="435" y="185">Encoder reading (hardware interrupts)</text>

    <circle cx="420" cy="220" r="5" fill="#e74c3c"/>
    <text x="435" y="225">Motor PWM + direction output</text>

    <circle cx="420" cy="260" r="5" fill="#e74c3c"/>
    <text x="435" y="265">Serial protocol parsing (ASCII)</text>

    <circle cx="420" cy="300" r="5" fill="#e74c3c"/>
    <text x="435" y="305">Safety timeout enforcement</text>

    <circle cx="420" cy="340" r="5" fill="#e74c3c"/>
    <text x="435" y="345">Emergency stop handling</text>
  </g>

  <!-- ==================== ARROW BETWEEN COLUMNS ==================== -->
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
  </defs>

  <!-- Pi → Mega (commands) -->
  <line x1="370" y1="140" x2="390" y2="140" stroke="#2980b9" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="380" y="133" text-anchor="middle" font-size="9" fill="#2980b9">V:rpm</text>

  <!-- Mega → Pi (data) -->
  <line x1="370" y1="340" x2="390" y2="340" stroke="#e74c3c" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="380" y="333" text-anchor="middle" font-size="9" fill="#e74c3c">ticks/RPM</text>

  <!-- ==================== BOTTOM NOTE ==================== -->
  <rect x="120" y="385" width="520" height="26" rx="6" fill="#ffffff" stroke="#bdc3c7" stroke-width="1"/>
  <text x="380" y="402" text-anchor="middle" font-size="11" fill="#2c3e50">Communication: UART serial at 115200 baud · Pi = master, Mega = slave</text>

</svg>
