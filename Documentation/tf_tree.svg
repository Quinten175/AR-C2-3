<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2040 1560" font-family="Arial, sans-serif" font-size="16" fill="#18324b" role="img" aria-labelledby="title desc">
  <title id="title">Manta Bot complete configured TF tree with URDF joint origins</title>
  <desc id="desc">SLAM publishes map to odom. diff_drive_controller publishes odom to base_footprint from assumed command-derived wheel states. The fixed base_footprint to base_link joint has yaw minus pi over two, not 180 degrees. base_link has fixed motor_left_1, motor_right_1 and lidar_link children. Motors have continuous wheel children; lidar_link has a fixed laser_frame child. All eight URDF links are shown with actual joint origins and rotations rounded for readability. robot_state_publisher owns URDF transforms; wheel states are not measured feedback. No camera frame exists in the URDF and no publication rates are assumed.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#315977"/></marker>
    <style>.edge{fill:none;stroke:#315977;stroke-width:2.5;marker-end:url(#arrow)}.node{fill:#fff;stroke:#8298ab;stroke-width:2}.frame{font-size:21px;font-weight:bold;font-family:monospace}.heading{font-size:21px;font-weight:bold}.warning{fill:#934413}.joint{font-size:15px;font-family:monospace}</style>
  </defs>
  <rect width="2040" height="1560" fill="#f5f8fb"/>
  <text x="50" y="52" font-size="30" font-weight="bold">Manta Bot | Full TF tree and joint origins</text>
  <text x="50" y="85">Source: urdf/robotassembly.urdf, diff_drive_controller.yaml and separate drive / SLAM launches.</text>
  <text x="50" y="114">Arrows point parent to child. xyz is in metres; rpy is in radians. Tiny floating-point residuals are rounded to zero.</text>

  <rect x="840" y="150" width="360" height="60" rx="10" fill="#eaf2f9" stroke="#8298ab" stroke-width="2"/>
  <text x="1020" y="188" text-anchor="middle" class="frame">map</text>
  <path d="M1020 210 V295" class="edge"/>
  <text x="1050" y="242">Dynamic | async SLAM Toolbox</text>
  <text x="1050" y="272">Alignment from /scan and the robot TF chain</text>
  <rect x="840" y="295" width="360" height="60" rx="10" fill="#eaf2f9" stroke="#8298ab" stroke-width="2"/>
  <text x="1020" y="333" text-anchor="middle" class="frame">odom</text>
  <path d="M1020 355 V440" class="edge"/>
  <text x="1050" y="387">Dynamic | diff_drive_controller; enable_odom_tf: true</text>
  <text x="1050" y="417" class="warning" font-weight="bold">Assumed wheel states, NOT measured encoder feedback</text>
  <rect x="840" y="440" width="360" height="60" rx="10" fill="#fff4d9" stroke="#8298ab" stroke-width="2"/>
  <text x="1020" y="478" text-anchor="middle" class="frame">base_footprint</text>
  <path d="M1020 500 V605" class="edge"/>
  <text x="1050" y="532" class="joint">Fixed: base_footprint_to_base_link</text>
  <text x="1050" y="562">xyz = (0, 0, 0); rpy = (0, 0, -pi/2)</text>
  <text x="1050" y="592" font-weight="bold">Yaw -90 degrees, not 180 degrees</text>
  <rect x="840" y="605" width="360" height="60" rx="10" fill="#edf6f1" stroke="#8298ab" stroke-width="2"/>
  <text x="1020" y="643" text-anchor="middle" class="frame">base_link</text>

  <path d="M930 665 V700 H360 V895" class="edge"/>
  <path d="M1020 665 V895" class="edge"/>
  <path d="M1110 665 V700 H1680 V895" class="edge"/>
  <rect x="70" y="735" width="580" height="135" rx="10" fill="#f5f8fb"/>
  <text x="90" y="765" class="joint">Fixed: base_link_motor_left_to_base_link</text>
  <text x="90" y="795">xyz = (-0.096, 0.0675, 0.00637336)</text>
  <text x="90" y="825">rpy ≈ (0, -pi/2, 0)</text>
  <text x="90" y="855">URDF motor mount, robot_state_publisher</text>
  <rect x="730" y="735" width="580" height="135" rx="10" fill="#f5f8fb"/>
  <text x="750" y="765" class="joint">Fixed: base_link_motor_right_to_base_link</text>
  <text x="750" y="795">xyz = (0.096, 0.06749806, 0.00639603)</text>
  <text x="750" y="825">rpy ≈ (-pi, -pi/2, 0)</text>
  <text x="750" y="855">URDF motor mount, robot_state_publisher</text>
  <rect x="1390" y="735" width="580" height="135" rx="10" fill="#f5f8fb"/>
  <text x="1410" y="765" class="joint">Fixed: base_link_lidar_link_to_base_link</text>
  <text x="1410" y="795">xyz = (0.0005, -0.0255, 0.0705)</text>
  <text x="1410" y="825">rpy ≈ (pi, 0, 0)</text>
  <text x="1410" y="855">URDF LiDAR mount, robot_state_publisher</text>
  <rect x="180" y="895" width="360" height="60" rx="10" class="node"/>
  <text x="360" y="933" text-anchor="middle" class="frame">motor_left_1</text>
  <rect x="840" y="895" width="360" height="60" rx="10" class="node"/>
  <text x="1020" y="933" text-anchor="middle" class="frame">motor_right_1</text>
  <rect x="1500" y="895" width="360" height="60" rx="10" class="node"/>
  <text x="1680" y="933" text-anchor="middle" class="frame">lidar_link</text>
  <path d="M360 955 V1175" class="edge"/>
  <path d="M1020 955 V1175" class="edge"/>
  <path d="M1680 955 V1175" class="edge"/>
  <rect x="70" y="985" width="580" height="165" rx="10" fill="#f5f8fb"/>
  <text x="90" y="1015" class="joint">Continuous: motor_left_1_wheel_left_to_motor_left</text>
  <text x="90" y="1045">xyz ≈ (-0.007, 0, 0.006); origin rpy ≈ (0, 0, 0)</text>
  <text x="90" y="1075">Axis ≈ (0, 0, 1); rotation varies with joint position</text>
  <text x="90" y="1105">robot_state_publisher via /joint_states</text>
  <text x="90" y="1135" class="warning">Command-integrated position, not measured feedback</text>
  <rect x="730" y="985" width="580" height="165" rx="10" fill="#f5f8fb"/>
  <text x="750" y="1015" class="joint">Continuous: motor_right_1_wheel_right_to_motor_right</text>
  <text x="750" y="1045">xyz ≈ (-0.007, 0, 0.006); origin rpy ≈ (0, 0, 0)</text>
  <text x="750" y="1075">Axis ≈ (0, 0, 1); rotation varies with joint position</text>
  <text x="750" y="1105">robot_state_publisher via /joint_states</text>
  <text x="750" y="1135" class="warning">Command-integrated position, not measured feedback</text>
  <rect x="1390" y="985" width="580" height="165" rx="10" fill="#f5f8fb"/>
  <text x="1410" y="1015" class="joint">Fixed: laser_frame_joint</text>
  <text x="1410" y="1045">xyz = (0, 0, 0); rpy ≈ (pi, 0, -pi/2)</text>
  <text x="1410" y="1075">robot_state_publisher</text>
  <text x="1410" y="1105">Real RPLiDAR /scan header frame_id: laser_frame</text>
  <text x="1410" y="1135">Direct Pi sensor, no Mega hop</text>
  <rect x="180" y="1175" width="360" height="60" rx="10" fill="#f3eff8" stroke="#8298ab" stroke-width="2"/>
  <text x="360" y="1213" text-anchor="middle" class="frame">wheel_left_1</text>
  <rect x="840" y="1175" width="360" height="60" rx="10" fill="#f3eff8" stroke="#8298ab" stroke-width="2"/>
  <text x="1020" y="1213" text-anchor="middle" class="frame">wheel_right_1</text>
  <rect x="1500" y="1175" width="360" height="60" rx="10" fill="#edf6f1" stroke="#8298ab" stroke-width="2"/>
  <text x="1680" y="1213" text-anchor="middle" class="frame">laser_frame</text>

  <rect x="40" y="1280" width="1960" height="240" rx="12" fill="#fff" stroke="#bbcbd9"/>
  <text x="65" y="1314" class="heading">Transform ownership and interpretation</text>
  <text x="65" y="1345">All 8 URDF links are shown, plus map and odom. Joint labels use joint origins, not mesh visual or inertial origins.</text>
  <text x="65" y="1375">robot_state_publisher owns fixed and continuous URDF edges; joint_state_broadcaster provides /joint_states from the C++ hardware plugin.</text>
  <text x="65" y="1405" class="warning">Plugin read() mirrors commands and integrates position. Mega RPM telemetry is unused; controller odometry and wheel transforms are command-derived.</text>
  <text x="65" y="1435">Compose diff_drive.launch.py (controllers and robot_state_publisher) with slam.launch.py (LiDAR and SLAM). Neither is a complete robot launch.</text>
  <text x="65" y="1465">No camera frame is defined in this URDF. No sensor, joint-state or TF publication frequency is assumed.</text>
  <path d="M65 1495 H140" class="edge"/><text x="160" y="1501">Legend: solid parent-to-child edges show configured TF relationships; labels distinguish fixed and dynamic ownership.</text>
</svg>
