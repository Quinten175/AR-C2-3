<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="660" fill="#fafafa"/>

  <!-- Title -->
  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#2c3e50">TF Tree — Manta Bot</text>
  <text x="450" y="54" text-anchor="middle" font-size="12" fill="#7f8c8d">URDF: robotassembly.urdf · odometry: static_odom_publisher.py</text>

  <!-- ================= Edges ================= -->
  <g stroke="#555555" stroke-width="2" fill="none">
    <!-- odom -> base_footprint -->
    <line x1="450" y1="103" x2="450" y2="146" marker-end="url(#arrow)"/>
    <!-- base_footprint -> base_link -->
    <line x1="450" y1="196" x2="450" y2="239" marker-end="url(#arrow)"/>
    <!-- base_link -> motor_left_1 -->
    <path d="M 450 289 L 450 312 L 170 312 L 170 332" marker-end="url(#arrow)"/>
    <!-- base_link -> motor_right_1 -->
    <line x1="450" y1="289" x2="450" y2="332" marker-end="url(#arrow)"/>
    <!-- base_link -> lidar_link -->
    <path d="M 450 289 L 450 312 L 730 312 L 730 332" marker-end="url(#arrow)"/>
    <!-- motor_left_1 -> wheel_left_1 -->
    <line x1="170" y1="379" x2="170" y2="422" marker-end="url(#arrow)"/>
    <!-- motor_right_1 -> wheel_right_1 -->
    <line x1="450" y1="379" x2="450" y2="422" marker-end="url(#arrow)"/>
  </g>

  <!-- Edge labels -->
  <g font-size="11" fill="#7f8c8d">
    <text x="458" y="130">odometry (dynamic)</text>
    <text x="458" y="223">fixed · yaw 180°</text>
    <text x="300" y="306" text-anchor="middle">fixed (URDF)</text>
    <text x="458" y="330">fixed (URDF)</text>
    <text x="600" y="306" text-anchor="middle">fixed (URDF)</text>
    <text x="178" y="405">~10.2 Hz</text>
    <text x="458" y="405">~10.2 Hz</text>
  </g>

  <!-- ================= Nodes ================= -->
  <!-- odom -->
  <g filter="url(#shadow)">
    <rect x="365" y="57" width="170" height="46" rx="10" fill="#d6eaf8" stroke="#1f77b4" stroke-width="2"/>
  </g>
  <text x="450" y="86" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#1f77b4">odom</text>

  <!-- base_footprint -->
  <g filter="url(#shadow)">
    <rect x="365" y="150" width="170" height="46" rx="10" fill="#fcf3cf" stroke="#b7950b" stroke-width="2"/>
  </g>
  <text x="450" y="179" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#7d6608">base_footprint</text>

  <!-- base_link -->
  <g filter="url(#shadow)">
    <rect x="365" y="243" width="170" height="46" rx="10" fill="#d5f5e3" stroke="#27ae60" stroke-width="2"/>
  </g>
  <text x="450" y="272" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#27ae60">base_link</text>

  <!-- motor_left_1 -->
  <g filter="url(#shadow)">
    <rect x="85" y="336" width="170" height="43" rx="10" fill="#fdebd0" stroke="#e67e22" stroke-width="2"/>
  </g>
  <text x="170" y="363" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#b9770e">motor_left_1</text>

  <!-- motor_right_1 -->
  <g filter="url(#shadow)">
    <rect x="365" y="336" width="170" height="43" rx="10" fill="#fdebd0" stroke="#e67e22" stroke-width="2"/>
  </g>
  <text x="450" y="363" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#b9770e">motor_right_1</text>

  <!-- lidar_link -->
  <g filter="url(#shadow)">
    <rect x="645" y="336" width="170" height="43" rx="10" fill="#fadbd8" stroke="#c0392b" stroke-width="2"/>
  </g>
  <text x="730" y="363" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#c0392b">lidar_link</text>

  <!-- wheel_left_1 -->
  <g filter="url(#shadow)">
    <rect x="85" y="426" width="170" height="43" rx="10" fill="#e8daef" stroke="#8e44ad" stroke-width="2"/>
  </g>
  <text x="170" y="453" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#6c3483">wheel_left_1</text>

  <!-- wheel_right_1 -->
  <g filter="url(#shadow)">
    <rect x="365" y="426" width="170" height="43" rx="10" fill="#e8daef" stroke="#8e44ad" stroke-width="2"/>
  </g>
  <text x="450" y="453" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#6c3483">wheel_right_1</text>

  <!-- ================= Notes ================= -->
  <g font-size="12" fill="#2c3e50">
    <rect x="60" y="496" width="780" height="66" rx="8" fill="#ffffff" stroke="#d5d8dc"/>
    <text x="80" y="518" font-weight="bold">Notes:</text>
    <text x="80" y="536">• <tspan font-family="monospace">odom → base_footprint</tspan> is published by the diff drive controller (<tspan font-family="monospace">base_frame_id: base_footprint</tspan>, <tspan font-family="monospace">enable_odom_tf: true</tspan>)</text>
    <text x="80" y="554">• <tspan font-family="monospace">base_footprint → base_link</tspan> is a fixed URDF joint with rpy = (0, 0, π) — do <tspan font-weight="bold">not</tspan> run <tspan font-family="monospace">static_odom_publisher</tspan> at the same time (duplicate TF broadcaster)</text>
  </g>

  <!-- ================= Legend ================= -->
  <g font-size="12" fill="#2c3e50">
    <rect x="60" y="580" width="780" height="56" rx="8" fill="#ffffff" stroke="#d5d8dc"/>
    <text x="80" y="603" font-weight="bold">Legend:</text>
    <rect x="140" y="591" width="14" height="14" fill="#d6eaf8" stroke="#1f77b4"/>
    <text x="160" y="603">odometry frame</text>
    <rect x="280" y="591" width="14" height="14" fill="#fcf3cf" stroke="#b7950b"/>
    <text x="300" y="603">base footprint</text>
    <rect x="410" y="591" width="14" height="14" fill="#d5f5e3" stroke="#27ae60"/>
    <text x="430" y="603">robot base</text>
    <rect x="525" y="591" width="14" height="14" fill="#fdebd0" stroke="#e67e22"/>
    <text x="545" y="603">motor</text>
    <rect x="610" y="591" width="14" height="14" fill="#e8daef" stroke="#8e44ad"/>
    <text x="630" y="603">wheel</text>
    <rect x="685" y="591" width="14" height="14" fill="#fadbd8" stroke="#c0392b"/>
    <text x="705" y="603">lidar</text>
  </g>
</svg>
